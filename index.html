<style>
:root{ color-scheme:light;
  --navy:#14213d; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --line-2:#f1f5f9;
  --bg:#f6f7f9; --card:#fff; --accent:#2d6a4f; --accent-2:#40916c; --warn:#b45309; --warn-bg:#fef3c7;
  --danger:#b91c1c; --danger-bg:#fee2e2; --ok:#166534; --ok-bg:#dcfce7; --info:#1d4ed8; --info-bg:#dbeafe;
  --radius:8px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
[hidden]{display:none!important}
h1,h2,h3,h4{margin:0}

/* gate */
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:24px}
.gate-card{background:#fff;border-radius:12px;padding:32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.gate-card h1{font-size:20px}.gate-card .sub{color:var(--muted);margin:0;font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:11.5px;font-weight:600;color:#374151;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select,.field textarea{border:1px solid #d1d5db;border-radius:6px;padding:8px 10px;background:#fff;outline:none;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,106,79,.15)}
.btn{border:1px solid transparent;border-radius:6px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.2}
.btn:hover{background:var(--accent-2)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border-color:#d1d5db}.btn.ghost:hover{background:#f9fafb}
.btn.sm{padding:5px 10px;font-size:12.5px}.btn.xs{padding:3px 8px;font-size:12px}
.btn.danger{background:var(--danger)}.btn.danger:hover{background:#991b1b}
.btn.link{background:none;border:none;color:var(--accent);padding:0;font-weight:500}.btn.link:hover{text-decoration:underline;background:none}
.btn.navy{background:var(--navy)}.btn.navy:hover{background:#1f2f57}
.err{color:var(--danger);font-size:12.5px;min-height:16px;margin-top:6px}
.note{font-size:12px;color:var(--muted);line-height:1.5}

/* layout */
#app{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
aside{background:var(--navy);color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand img{width:36px;height:36px;border-radius:50%;background:#fff;object-fit:contain}
.brand .t{color:#fff;font-weight:700;letter-spacing:.02em;line-height:1.1}.brand .s{font-size:11px;color:#94a3b8}
nav{padding:8px;flex:1;overflow:auto}
nav .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:#64748b;padding:12px 10px 4px}
nav a.item{display:flex;align-items:center;justify-content:space-between;color:#cbd5e1;padding:7px 10px;border-radius:6px;font-weight:500;cursor:pointer}
nav a.item:hover{background:rgba(255,255,255,.06);text-decoration:none;color:#fff}
nav a.item.on{background:rgba(255,255,255,.12);color:#fff}
nav .cnt{font-size:11px;background:rgba(255,255,255,.12);padding:1px 7px;border-radius:999px;color:#e2e8f0}
nav .cnt.warn{background:var(--warn);color:#fff}
.userbox{padding:12px 14px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.userbox b{color:#fff;display:block}.userbox .role{color:#94a3b8;font-size:11px;text-transform:capitalize}
.userbox button{background:none;border:none;color:#94a3b8;cursor:pointer;font-size:12px}.userbox button:hover{color:#fff}
main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar h2{font-size:17px;font-weight:700;flex:0 0 auto}
.topbar .sp{flex:1}
.search{position:relative;flex:0 1 360px}
.search input{width:100%;border:1px solid #d1d5db;border-radius:6px;padding:7px 12px 7px 32px;background:#fff}
.search svg{position:absolute;left:10px;top:8px;width:16px;height:16px;color:#9ca3af}
.content{padding:18px 24px 40px;flex:1}
#banner{background:var(--warn-bg);color:#78350f;border-bottom:1px solid #fcd34d;padding:8px 24px;font-size:13px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap;vertical-align:middle}
.pill.cur{background:var(--ok-bg);color:var(--ok)}.pill.pro{background:var(--info-bg);color:var(--info)}
.pill.non{background:#f3f4f6;color:#4b5563}.pill.uns{background:#f3f4f6;color:#6b7280}
.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.tag{background:#eef2ff;color:#3730a3}
.pill.gr{background:#fff;border-color:#d1d5db;color:#374151;font-family:var(--mono);font-size:11px}
.pill.gr.a{border-color:#86efac;background:#f0fdf4;color:#166534}
.pill.stage{background:#f5f3ff;color:#5b21b6}.pill.lead{background:#fdf2f8;color:#9d174d}
.pill.crit{background:var(--danger-bg);color:var(--danger)}.pill.high{background:var(--warn-bg);color:var(--warn)}
.pill.med{background:var(--info-bg);color:var(--info)}.pill.low{background:#f3f4f6;color:#4b5563}
.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:4px}
.status-dot.live{background:#22c55e}.status-dot.ro{background:#f59e0b}

/* toolbar / chips / cards / tables */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar select,.toolbar input[type=text],.toolbar input[type=search]{border:1px solid #d1d5db;border-radius:6px;padding:6px 9px;background:#fff;font-size:13px}
.toolbar .meta{margin-left:auto;color:var(--muted);font-size:12.5px}
.chip{border:1px solid #d1d5db;background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:#374151;user-select:none}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:12px 14px}.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.01em}.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.tbl-wrap{overflow:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
thead th{position:sticky;top:0;background:#f9fafb;text-align:left;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:#4b5563;padding:8px 11px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;z-index:1}
thead th.nos{cursor:default}thead th .arr{opacity:.4;margin-left:4px;font-size:10px}thead th.sorted .arr{opacity:1;color:var(--accent)}
tbody td{padding:7px 11px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
tbody tr:hover td{background:#fafbfc}tbody tr.row{cursor:pointer}
td.wrap{white-space:normal;max-width:340px}td .sub{display:block;font-size:11.5px;color:var(--muted)}
.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:12px}.tr{text-align:right}
.empty{padding:36px;text-align:center;color:var(--muted)}
.chk{width:15px;height:15px;cursor:pointer}
.bulk{display:flex;gap:8px;align-items:center;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;margin-bottom:12px}
.bulk select{border-radius:6px;border:none;padding:5px 8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.alert{border-radius:8px;padding:10px 12px;font-size:13px;border:1px solid;margin-bottom:8px}
.alert.warn{background:var(--warn-bg);border-color:#fcd34d;color:#78350f}.alert.info{background:var(--info-bg);border-color:#bfdbfe;color:#1e3a8a}
.alert.ok{background:var(--ok-bg);border-color:#bbf7d0;color:#14532d}.alert.err{background:var(--danger-bg);border-color:#fecaca;color:#7f1d1d}
.list{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.list .li{display:flex;gap:12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.list .li:last-child{border-bottom:none}.list .li .grow{flex:1;min-width:0}
.list .li .nm{font-weight:600}.list .li .em{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.section{margin-top:18px}.section h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#4b5563;display:flex;align-items:center;gap:8px}
.section h4 .btn{margin-left:auto}
.kv{font-size:13px;margin-bottom:10px}.kv .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;margin-bottom:1px}.kv .v{min-height:18px}
textarea{min-height:64px;resize:vertical}
code{font-family:var(--mono);background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:12px}
ol.steps{padding-left:20px;line-height:1.7;font-size:13px}

/* record page */
.rec-head{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);margin-bottom:14px}
.rec-head .back{font-size:12.5px;color:var(--muted);display:inline-block;margin-bottom:8px}
.rec-head h2{font-size:22px;letter-spacing:-.01em}
.rec-head .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin:6px 0 12px;align-items:center;font-size:12.5px;color:var(--muted)}
.actbar{display:flex;flex-wrap:wrap;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.actbar .btn{padding:6px 11px;font-size:12.5px}
.rec-grid{display:grid;grid-template-columns:360px 1fr;gap:14px;align-items:start}
.rec-left>.card{padding:14px 16px;margin-bottom:12px}
.rec-left h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#4b5563;margin-bottom:8px;display:flex;align-items:center}
.rec-left h4 .btn{margin-left:auto}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.stat{background:#f9fafb;border-radius:6px;padding:8px 10px}.stat .l{font-size:11px;color:var(--muted)}.stat .v{font-weight:700;font-size:15px}
.composer{padding:12px 14px;margin-bottom:12px}
.composer .types{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.composer .types .btn{padding:5px 10px;font-size:12.5px}
.composer .types .btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.composer .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.composer .row .field{margin:0;flex:1;min-width:120px}
.timeline{padding:4px 14px}
.tl{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.tl:last-child{border-bottom:none}
.tl .ic{width:34px;height:34px;border-radius:8px;background:#f3f4f6;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#374151;flex:0 0 auto;text-transform:uppercase}
.tl .ic.order{background:var(--ok-bg);color:var(--ok)}.tl .ic.stage{background:#f5f3ff;color:#5b21b6}.tl .ic.claim{background:#fdf2f8;color:#9d174d}.tl .ic.task{background:var(--info-bg);color:var(--info)}
.tl .body{flex:1;min-width:0}.tl .who{color:var(--muted);font-size:12px;margin-top:2px}
.tl .body .t{font-weight:600}
.nextstep{background:var(--info-bg);border:1px solid #bfdbfe;border-radius:8px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.nextstep.over{background:var(--warn-bg);border-color:#fcd34d}
.nextstep .grow{flex:1}
.key-contacts .kc{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.key-contacts .kc:last-child{border-bottom:none}
.key-contacts .role{flex:0 0 78px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;padding-top:2px}
.key-contacts .who{flex:1;min-width:0}.key-contacts .who .e{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* insights */
.ins-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.ins-card{padding:14px 16px;border-left:4px solid #d1d5db;margin-bottom:10px}
.ins-card.critical{border-left-color:var(--danger)}.ins-card.high{border-left-color:var(--warn)}.ins-card.medium{border-left-color:var(--info)}.ins-card.low{border-left-color:#9ca3af}
.ins-card .hl{font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ins-card .as{margin:6px 0;color:#374151;line-height:1.5}
.ins-card .ac{font-size:13px;background:#f9fafb;border-radius:6px;padding:8px 10px}
.ins-card .ac b{color:var(--accent)}
.opp{padding:0;margin-bottom:12px}.opp h4{padding:10px 14px;margin:0;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#4b5563;display:flex;justify-content:space-between}
.opp .li{padding:8px 14px;border-bottom:1px solid var(--line-2);display:flex;gap:10px;align-items:center;cursor:pointer;font-size:13px}
.opp .li:hover{background:#fafbfc}.opp .li:last-child{border-bottom:none}
.opp .li .grow{flex:1;min-width:0}.opp .li .why{font-size:12px;color:var(--muted)}
.opp .li .amt{font-weight:700;font-variant-numeric:tabular-nums}

/* board */
.board{display:grid;gap:10px;overflow:auto;padding-bottom:8px}
.col{padding:10px;background:#f9fafb;min-height:120px;border-radius:8px;border:1px solid var(--line)}
.col .ch{display:flex;justify-content:space-between;font-weight:700;font-size:12.5px;margin-bottom:8px}
.cardm{padding:8px 10px;margin-bottom:6px;cursor:pointer;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:6px}
.cardm:hover{border-color:#cbd5e1}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-card{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.35);max-height:92vh;display:flex;flex-direction:column}
.modal-card .mh{padding:16px 22px 0;display:flex;align-items:center}.modal-card h3{font-size:16px;flex:1}
.modal-card .mb{padding:12px 22px;overflow:auto}.modal-card .mf{padding:12px 22px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast.err{background:var(--danger)}
@media (max-width:960px){ .rec-grid{grid-template-columns:1fr} .ins-grid{grid-template-columns:1fr} }
@media (max-width:860px){ #app{grid-template-columns:1fr} aside{position:relative;height:auto} nav{display:flex;flex-wrap:wrap;gap:2px;padding:6px} nav .grp{display:none} .userbox{width:100%} .grid2{grid-template-columns:1fr} }
</style>
</head>

<div id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">

      <div><h1>CCGL CRM</h1><p class="sub">Cape Cod Grow Lab · Wholesale</p></div>

    <div class="err" id="gErr"></div>

</div>

<div id="app" hidden>

      <div class="sp"></div>
      <button class="btn ghost sm" id="newAccountTop">+ New account</button>
      <button class="btn sm" id="newOrderTop">+ New order</button>
      <span class="note" id="syncState"><span class="status-dot"></span>loading…</span>
      <button class="btn ghost sm" id="reloadBtn" title="Reload from GitHub">Reload</button>

  </main>
</div>

    const r=await fetch(this.api(p),{method:'PUT',headers:{...this.hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409||r.status===422) throw new Error('CONFLICT'); if(r.status===401) throw new Error('BAD_PAT'); if(!r.ok) throw new Error(`GitHub write ${p}: ${r.status}`);
    return (await r.json()).content.sha;
  },
  async update(p,mutate,message){ for(let i=0;i<2;i++){ const {data}=await this.read(p); const sha=this.pat?await this.sha(p):null; const next=mutate(data??[]); try{ await this.write(p,next,`[${S.user?.id||'system'}] ${message}`,sha); return next; }catch(e){ if(e.message==='CONFLICT'&&i===0) continue; throw e; } } }
};

/* ---------------- indexes ---------------- */
let A={},L={},ALL={},C={},contactsByAcc={},ordersByAcc={},actsByAcc={};
function index(){
  A=byId(S.accounts); L=byId(S.leads); ALL={...L,...A}; C=byId(S.contacts);
  contactsByAcc={}; for(const c of S.contacts) (contactsByAcc[c.account_id||'_none']??=[]).push(c);
  ordersByAcc={}; for(const o of S.orders) if(o.account_id) (ordersByAcc[o.account_id]??=[]).push(o);
  for(const l of Object.values(ordersByAcc)) l.sort((p,q)=>cmp(q.date,p.date));
  actsByAcc={}; for(const [u,list] of Object.entries(S.activities)) for(const x of list) (actsByAcc[x.account_id]??=[]).push({...x,user:u});
  for(const l of Object.values(actsByAcc)) l.sort((p,q)=>cmp(q.date,p.date)||cmp(q.ts,p.ts));
  for(const a of [...S.accounts,...S.leads]){
    const acts=actsByAcc[a.id]||[]; const lt=acts.find(x=>['Call','Visit','Text','Email','Note'].includes(x.type))?.date;
    a._last=[a.last_contact,lt].filter(Boolean).sort().pop()||''; a._days=daysSince(a._last); a._nContacts=(contactsByAcc[a.id]||[]).length;
    const os=(ordersByAcc[a.id]||[]).filter(o=>!/pend/i.test(o.status||'')); a._nOrders=os.length; a._orderTotal=os.reduce((t,o)=>t+(o.total||0),0); a._lastOrder=os[0]?.date||''; a._daysOrder=daysSince(a._lastOrder); a._pending=(ordersByAcc[a.id]||[]).filter(o=>/pend/i.test(o.status||'')).length;
    const ds=os.map(o=>o.date).filter(Boolean).sort(); const gaps=[]; for(let i=1;i<ds.length;i++){ const g=(new Date(ds[i])-new Date(ds[i-1]))/864e5; if(g>0) gaps.push(g); }
    a._avgGap=gaps.length?Math.round(gaps.reduce((x,y)=>x+y,0)/gaps.length):null;
    a._due=a._avgGap&&a._daysOrder!=null? a._avgGap-a._daysOrder : null;   // +n = due in n days, -n = n days late
    a._quiet=a._daysOrder!=null? a._daysOrder>Math.max(30,a._avgGap?Math.round(a._avgGap*1.5):45) : null;
    a._q3=os.filter(o=>{const d=daysSince(o.date); return d!=null&&d<90;}).reduce((s,o)=>s+(o.total||0),0);
    a._q2=os.filter(o=>{const d=daysSince(o.date); return d!=null&&d>=90&&d<180;}).reduce((s,o)=>s+(o.total||0),0);
    const roles=r=>(contactsByAcc[a.id]||[]).filter(c=>(c.role||'').toLowerCase().startsWith(r));
    a._buyer=roles('buyer')[0]||(contactsByAcc[a.id]||[]).find(c=>c.primary)||null; a._finance=[...roles('finance'),...roles('ar'),...roles('billing')][0]||null; a._intake=roles('intake')[0]||null;
    a._nsOver=!!(a.next_step&&a.next_step_due&&a.next_step_due<today());
  }
}

async function guarded(fn){ if(S.readOnly){ toast('Preview is read-only — this would save in the live app.',true); return; } if(!GH.pat){ promptPat(); return; } try{ await fn(); }catch(e){ if(['NO_PAT','BAD_PAT'].includes(e.message)){ GH.pat=''; promptPat(); } else if(e.message==='CONFLICT'){ toast('Someone else saved at the same moment — reloaded, please retry.',true); await loadAll(); } else { toast('Save failed: '+e.message,true); console.error(e); } } }
async function saveAccounts(mutate,msg){ await guarded(async()=>{ S.accounts=await GH.update(F.accounts,mutate,msg); index(); render(); toast('Saved'); }); }
async function saveLeads(mutate,msg){ await guarded(async()=>{ S.leads=await GH.update(F.leads,mutate,msg); index(); render(); toast('Saved'); }); }
async function saveAny(id,fn,msg){ if(L[id]) return saveLeads(ls=>{ const x=ls.find(y=>y.id===id); if(x) fn(x); return ls; },msg); return saveAccounts(as=>{ const x=as.find(y=>y.id===id); if(x) fn(x); return as; },msg); }
async function saveContacts(mutate,msg){ await guarded(async()=>{ S.contacts=await GH.update(F.contacts,mutate,msg); index(); render(); toast('Saved'); }); }
async function saveUsers(mutate,msg){ await guarded(async()=>{ S.users=await GH.update(F.users,mutate,msg); S.user=S.users.find(u=>u.id===S.user.id)||S.user; render(); }); }
async function saveSettings(mutate,msg){ await guarded(async()=>{ S.settings=await GH.update(F.settings,mutate,msg); render(); toast('Settings saved'); }); }
async function appendActivity(entry,msg){ const p=`data/activities/${S.user.id}.json`; S.activities[S.user.id]=await GH.update(p,l=>[...(l||[]),{id:uid('X'),ts:new Date().toISOString(),...entry}],msg); }
async function logActivity(accId,type,note,date,contactId){ await guarded(async()=>{ await appendActivity({account_id:accId,type,note,date,contact_id:contactId||null},`Log ${type} — ${ALL[accId]?.name}`); index(); render(); toast(`${type} logged`); }); }
async function setStage(id,stage){ const a=A[id]; if(!a) return; await guarded(async()=>{ const from=a.stage||'New'; S.accounts=await GH.update(F.accounts,as=>{ const x=as.find(y=>y.id===id); if(x){ x.stage=stage; x.stage_entered=today(); if(stage==='Customer'){ x.status='Current'; } } return as; },`Stage ${from} → ${stage} — ${a.name}`); await appendActivity({account_id:id,type:'Stage',note:`${from} → ${stage}`,date:today()},`Stage note — ${a.name}`); index(); render(); toast(`Moved to ${stage}`); }); }
async function claimLead(id){ const l=L[id]; if(!l) return; if(S.readOnly){ toast('Preview is read-only — in the live app this moves the lead into your Prospects.',true); return; }
  let nm=null; if((l.flags||[]).includes('name-from-domain')){ nm=prompt('This lead came in as a web domain. What is the company actually called?',l.name.replace(/\.(com|net|org|co)$/,'')); if(nm===null||nm.trim()==='') return; }
  await guarded(async()=>{ const now=today(); const moved={...l,name:(nm||l.name).trim(),claimed:true,claimed_by:S.user.id,claimed_at:now,owner:['rep','manager'].includes(S.user.role)?S.user.name:(l.owner||'Unassigned'),status:'Prospect',stage:'New',stage_entered:now,flags:(l.flags||[]).filter(f=>!['unassigned','name-from-domain'].includes(f)),tags:(l.tags||[]).filter(t=>t!=='Unprocessed Lead')};
    S.leads=await GH.update(F.leads,ls=>ls.filter(x=>x.id!==id),`Claim ${moved.name} (remove from pool)`);
    S.accounts=await GH.update(F.accounts,as=>[...as,moved],`Claim ${moved.name} → Prospects`);
    await appendActivity({account_id:id,type:'Claim',note:`Claimed from Unclaimed Leads (${l.source})`,date:now},`Claim note — ${moved.name}`);
    index(); S.view='pipeline'; open(id); toast(`${moved.name} is yours — it's in Prospects now`); }); }
function setNextStepFields(list,id,t,d,o){ const x=list.find(y=>y.id===id); if(x){ x.next_step=t; x.next_step_due=d; x.next_step_owner=o; } return list; }
function nextStepForm(id){ const a=ALL[id]; const m=modal('Next step — '+a.name,`<div class="field"><label>What's next</label><input id="nsText" value="${esc(a.next_step||'')}" placeholder="e.g. Drop samples, follow up on menu placement"></div><div class="grid2"><div class="field"><label>Due</label><input id="nsDue" type="date" value="${esc(a.next_step_due||'')}"></div><div class="field"><label>Owner</label><select id="nsOwner">${S.users.map(u=>`<option value="${u.id}" ${(a.next_step_owner||S.user.id)===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div></div>`,`<button class="btn ghost" data-close>Cancel</button><button class="btn" id="nsSave">Save</button>`);
  $('#nsSave',m).onclick=()=>{ const t=$('#nsText',m).value.trim(), d=$('#nsDue',m).value, o=$('#nsOwner',m).value; if(!t) return; closeModal(); guarded(async()=>{ if(L[id]) S.leads=await GH.update(F.leads,ls=>setNextStepFields(ls,id,t,d,o),`Next step — ${a.name}`); else S.accounts=await GH.update(F.accounts,as=>setNextStepFields(as,id,t,d,o),`Next step — ${a.name}`); await appendActivity({account_id:id,type:'Task',note:`Next step: ${t}${d?' (due '+fmtDate(d)+')':''}`,date:today()},`Task note — ${a.name}`); index(); render(); toast('Next step saved'); }); }; }
async function completeNextStep(id){ const a=ALL[id]; if(!a?.next_step) return; const t=a.next_step; await guarded(async()=>{ if(L[id]) S.leads=await GH.update(F.leads,ls=>setNextStepFields(ls,id,'','',''),`Done: ${t} — ${a.name}`); else S.accounts=await GH.update(F.accounts,as=>setNextStepFields(as,id,'','',''),`Done: ${t} — ${a.name}`); await appendActivity({account_id:id,type:'Task',note:`Done: ${t}`,date:today()},`Task done — ${a.name}`); index(); render(); toast('Marked done'); }); }
function newOrderForm(accId){

    <div class="field"><label>Contact</label>${cs.length?`<select id="oContact"><option value="">—</option>${cs.map(c=>`<option value="${c.id}">${esc(c.name||c.email)}</option>`).join('')}</select>`:'<input id="oContactTxt" placeholder="name or email">'}</div>

  $('#oAcc',m).onchange=()=>{ const v=$('#oAcc',m).value; if(v&&v!==accId){ closeModal(); newOrderForm(v); } };

    <div class="grid2"><div class="field"><label>Town</label><input id="naTown"></div><div class="field"><label>License #</label><input id="naLic" placeholder="MR28…"></div>
    <div class="field"><label>Where it goes</label><select id="naKind"><option value="Current" ${kind==='Current'?'selected':''}>Active Accounts (already buying)</option><option value="Prospect" ${kind==='Prospect'?'selected':''}>Prospects (working it)</option><option value="Lead" ${kind==='Lead'?'selected':''}>Unclaimed Leads (parked)</option></select></div>
    <div class="field"><label>Owner</label><select id="naOwner">${owners.map(o=>`<option ${o===S.user.name&&['rep','manager'].includes(S.user.role)?'selected':''}>${esc(o)}</option>`).join('')}<option value="Unassigned">Unassigned</option></select></div>
    <div class="field"><label>License type</label><select id="naType"><option>Dispensary</option><option>Production</option><option>Delivery</option><option>Other</option></select></div><div class="field"><label>Grade</label><select id="naGrade"><option value="">—</option>${(S.settings.grades||[]).map(g=>`<option>${g}</option>`).join('')}</select></div></div>
    <div class="field"><label>Address</label><input id="naAddr"></div>
    <div class="section" style="margin-top:6px"><h4>First contact <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400">optional</span></h4><div class="grid2"><div class="field"><label>Name</label><input id="naCName"></div><div class="field"><label>Role</label><select id="naCRole"><option>Buyer</option><option>Owner</option><option>General Manager</option><option>Intake</option><option>Finance / AP</option><option>Other</option></select></div><div class="field"><label>Email</label><input id="naCEmail" type="email"></div><div class="field"><label>Phone</label><input id="naCPhone"></div></div></div>
    <div class="field"><label>Notes</label><textarea id="naNotes" style="min-height:50px" placeholder="how you found them, what they said…"></textarea></div>`,
    `<button class="btn ghost" data-close>Cancel</button><button class="btn" id="naSave">Create</button>`);
  const nameIn=$('#naName',m), dupBox=$('#naDup',m);
  nameIn.oninput=()=>{ const n=normName(nameIn.value); if(n.length<4){ dupBox.innerHTML=''; return; } const hits=[...S.accounts,...S.leads].filter(a=>{ const an=normName(a.name); return an&&(an===n||an.includes(n)||n.includes(an)); }).slice(0,4); dupBox.innerHTML=hits.length?`<div class="alert warn" style="margin:-6px 0 10px"><b>Already in the CRM?</b> ${hits.map(a=>`<a href="#" data-openx="${a.id}">${esc(a.name)}${a.town?' · '+esc(a.town):''}</a> <span class="muted">(${L[a.id]?'unclaimed lead':a.status==='Current'?'active':'prospect'})</span>`).join(' · ')}<br><span class="note">Different location of the same company? Fine — just put the town in.</span></div>`:''; $$('[data-openx]',dupBox).forEach(a=>a.onclick=e=>{ e.preventDefault(); closeModal(); open(a.dataset.openx); }); };
  $('#naSave',m).onclick=()=>{
    const name=nameIn.value.trim(); if(!name){ nameIn.focus(); return; }
    const k=$('#naKind',m).value; const now=today();
    const acc={id:uid('A'),sheet_key:'',source:`CRM (${S.user.name})`,name,parent:'',town:$('#naTown',m).value.trim(),address:$('#naAddr',m).value.trim(),license_type:$('#naType',m).value,status:k==='Current'?'Current':'Prospect',grade:$('#naGrade',m).value,owner:$('#naOwner',m).value||'Unassigned',last_contact:'',next_contact:'',notes:$('#naNotes',m).value.trim(),stage:k==='Current'?'Customer':'New',stage_entered:now,delivery_notes:'',standing_requests:'',license_number:$('#naLic',m).value.trim().toUpperCase(),tags:[],flags:[],dup_candidates:[],created:now,created_by:S.user.id};
    if(acc.owner==='Unassigned') acc.flags.push('unassigned');
    if(k!=='Lead'){ acc.claimed=true; acc.claimed_by=S.user.id; acc.claimed_at=now; }
    const cn=$('#naCName',m).value.trim(), ce=$('#naCEmail',m).value.trim().toLowerCase(), cp=$('#naCPhone',m).value.trim(), cr=$('#naCRole',m).value;
    closeModal();
    guarded(async()=>{
      if(k==='Lead') S.leads=await GH.update(F.leads,ls=>[...ls,acc],`New lead — ${name}`); else S.accounts=await GH.update(F.accounts,as=>[...as,acc],`New ${k==='Current'?'active account':'prospect'} — ${name}`);
      if(cn||ce||cp) S.contacts=await GH.update(F.contacts,cs=>[...cs,{id:uid('C'),account_id:acc.id,name:cn,email:ce,phone:cp,role:cr,source:`CRM (${S.user.name})`,primary:true,created:now}],`Add person ${cn||ce} — ${name}`);
      await appendActivity({account_id:acc.id,type:'Note',note:`Created as ${k==='Current'?'active account':k==='Lead'?'unclaimed lead':'prospect'}${acc.notes?' — '+acc.notes:''}`,date:now},`Created — ${name}`);
      index(); open(acc.id); toast(`${name} created`); });
  };
  setTimeout(()=>nameIn.focus(),50);
}
function addContactForm(accId){ const m=modal('Add person',`<div class="grid2"><div class="field"><label>Name</label><input id="ncName"></div><div class="field"><label>Role</label><select id="ncRole"><option value="">—</option>${['Buyer','Intake','Finance / AP','Owner','General Manager','Inventory','Other'].map(r=>`<option>${r}</option>`).join('')}</select></div><div class="field"><label>Email</label><input id="ncEmail" type="email"></div><div class="field"><label>Phone</label><input id="ncPhone"></div></div>`,`<button class="btn ghost" data-close>Cancel</button><button class="btn" id="ncSave">Add</button>`);
  $('#ncSave',m).onclick=()=>{ const c={name:$('#ncName',m).value.trim(),role:$('#ncRole',m).value,email:$('#ncEmail',m).value.trim().toLowerCase(),phone:$('#ncPhone',m).value.trim()}; if(!c.name&&!c.email){ toast('Need a name or an email',true); return; } closeModal(); saveContacts(cs=>{ if(c.email&&cs.some(x=>x.email===c.email&&x.account_id===accId)) throw new Error('That email is already on this account.'); cs.push({id:uid('C'),account_id:accId,...c,source:`CRM (${S.user.name})`,primary:false,created:today()}); return cs; },`Add person ${c.name||c.email} — ${ALL[accId]?.name}`); }; }
function editContact(id){ const c=C[id]; if(!c) return; const fromSheet=['Master','Customer Tracker'].includes(c.source); const m=modal('Edit person',`<div class="grid2"><div class="field"><label>Name</label><input id="ecName" value="${esc(c.name||'')}"></div><div class="field"><label>Role</label><input id="ecRole" value="${esc(c.role||'')}" list="roles"><datalist id="roles">${['Buyer','Intake','Finance / AP','Owner','General Manager','Inventory'].map(r=>`<option value="${r}">`).join('')}</datalist></div><div class="field"><label>Email</label><input id="ecEmail" value="${esc(c.email||'')}"></div><div class="field"><label>Phone</label><input id="ecPhone" value="${esc(c.phone||'')}"></div></div><p class="note">${fromSheet?'Name and email refresh from the Sheet / Tracker on re-import; role and phone stick.':'Added outside the Sheet — fully editable.'}</p>`,`<button class="btn ghost" data-close>Cancel</button>${!fromSheet?'<button class="btn danger" id="ecDel">Remove</button>':''}<button class="btn" id="ecSave">Save</button>`);
  $('#ecSave',m).onclick=()=>{ const v={name:$('#ecName',m).value.trim(),role:$('#ecRole',m).value.trim(),email:$('#ecEmail',m).value.trim().toLowerCase(),phone:$('#ecPhone',m).value.trim()}; closeModal(); saveContacts(cs=>{ const x=cs.find(y=>y.id===id); if(x) Object.assign(x,v); return cs; },`Edit person ${v.name||v.email}`); };
  const del=$('#ecDel',m); if(del) del.onclick=()=>{ if(!confirm('Remove this person?')) return; closeModal(); saveContacts(cs=>cs.filter(y=>y.id!==id),`Remove person ${c.name||c.email}`); }; }
async function mergeAccounts(fromId,intoId){ const from=ALL[fromId],into=ALL[intoId]; if(!from||!into) return; if(!confirm(`Merge "${from.name}" into "${into.name}"? People, orders, tags, license and notes move over; "${from.name}" is removed.`)) return;
  await guarded(async()=>{ S.contacts=await GH.update(F.contacts,cs=>{ for(const c of cs) if(c.account_id===fromId) c.account_id=intoId; return cs; },`Merge people ${from.name} → ${into.name}`);
    S.orders=await GH.update(F.orders,os=>{ for(const o of os) if(o.account_id===fromId) o.account_id=intoId; return os; },`Merge orders ${from.name} → ${into.name}`);
    const fromCopy={...from};
    const enrich=t=>{ t.tags=uniq([...(t.tags||[]),...(fromCopy.tags||[])]); if(!t.address&&fromCopy.address) t.address=fromCopy.address; if(!t.license_number&&fromCopy.license_number) t.license_number=fromCopy.license_number; if(fromCopy.delivery_notes) t.delivery_notes=[t.delivery_notes,fromCopy.delivery_notes].filter(Boolean).join('\n'); t.merged_from=[...(t.merged_from||[]),{id:fromCopy.id,name:fromCopy.name,source:fromCopy.source,date:today()}]; };
    const clearDup=list=>{ for(const x of list){ if(x.dup_candidates?.includes(fromId)){ x.dup_candidates=x.dup_candidates.filter(i=>i!==fromId); if(!x.dup_candidates.length) x.flags=(x.flags||[]).filter(fl=>fl!=='possible-duplicate'); } } return list; };
    if(L[fromId]) S.leads=await GH.update(F.leads,ls=>clearDup(ls.filter(x=>x.id!==fromId)),`Remove ${from.name} (merged)`); else S.accounts=await GH.update(F.accounts,as=>clearDup(as.filter(x=>x.id!==fromId)),`Remove ${from.name} (merged)`);
    if(A[intoId]) S.accounts=await GH.update(F.accounts,as=>{ const t=as.find(x=>x.id===intoId); if(t) enrich(t); return clearDup(as); },`Merge ${from.name} → ${into.name}`); else S.leads=await GH.update(F.leads,ls=>{ const t=ls.find(x=>x.id===intoId); if(t) enrich(t); return clearDup(ls); },`Merge ${from.name} → ${into.name}`);
    if((S.activities[S.user.id]||[]).some(x=>x.account_id===fromId)) S.activities[S.user.id]=await GH.update(`data/activities/${S.user.id}.json`,l=>(l||[]).map(x=>x.account_id===fromId?{...x,account_id:intoId}:x),`Re-point activities → ${into.name}`);
    index(); open(intoId); toast(`Merged into ${into.name}`); }); }

/* ---------------- preview self-test (console only) ---------------- */
async function selfTest(){
  const errs=[]; const oe=console.error; console.error=(...a)=>{ errs.push(a.map(String).join(' ')); oe(...a); }; window.addEventListener('error',e=>errs.push('window: '+e.message));
  try{ for(const u of ['matt','joey','charley']){ S.user=S.users.find(x=>x.id===u); await enter(); const r={};
      for(const vw of ['insights','active','pipeline','prospects','orders','tasks','people','emails','activity','settings']){ S.view=vw; S.record=null; S.q=''; render(); r[vw]={rows:$$('#view tbody tr, #view .opp .li, #view .ins-card, #view .list .li').length,nav:!!$$('#nav .item').find(a=>a.dataset.view===vw)}; }
      const apex=S.accounts.find(a=>a.name==='Apex Noire'); if(apex){ S.record=apex.id; render(); r.record={title:$('#view h2')?.textContent,alerts:$$('#view .alert').length,actbar:$$('#view .actbar .btn, #view .actbar select').length,key:$$('#view .key-contacts .kc').length,timeline:$$('#view .timeline .tl').length,people:$$('#view .rec-left .list .li').length}; }
      const lead=S.leads[0]; if(lead){ S.record=lead.id; render(); r.leadRecord={title:$('#view h2')?.textContent,claimBtn:$$('#view [data-claim]').length}; }
      S.record=null; S.view='pipeline'; (S.filters.pipeline||={}).mode='board'; render(); r.board=$$('#view [data-stage]').map(c=>c.dataset.stage+':'+$$('[data-drag]',c).length); S.filters.pipeline.mode='table';
      S.view='active'; (S.filters.active||={}).mode='orders'; render(); r.activeOrdersCols=$$('#view thead th').length; S.filters.active.mode='contacts';
      S.view='emails'; render(); r.emailsShown=$$('#view tbody tr').length;
      const O=opportunities(); r.opps=Object.fromEntries(Object.entries(O).map(([k,o])=>[k,o.rows.length]));
      console.log('SELFTEST-'+u+'-views '+JSON.stringify(Object.fromEntries(Object.entries(r).filter(([k])=>!['record','leadRecord','board','opps'].includes(k)))));
      console.log('SELFTEST-'+u+'-record '+JSON.stringify({record:r.record,lead:r.leadRecord,board:r.board}));
      console.log('SELFTEST-'+u+'-opps '+JSON.stringify(r.opps)); }
  }catch(e){ errs.push('selftest exception: '+(e.stack||e.message)); }
  console.log('SELFTEST-ERRORS '+JSON.stringify(errs)); console.error=oe;
  S.user=null; S.view='insights'; S.record=null; S.filters={}; sessionStorage.removeItem(SESSION_KEY); location.hash=''; $('#app').hidden=true; $('#gate').hidden=false;
}
boot().then(()=>{ if(window.CCGL_SELFTEST) return selfTest(); });
</script>
